services:
  database:
    build: ./infra/database
    env_file: ./infra/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  valkey:
    build: ./infra/cache
    env_file: ./infra/.env
    command: ["sh", "-c", "valkey-server --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: ./api
    env_file: ./api/.env
    environment:
      DB_HOST: database
      VALKEY_HOST: valkey
    depends_on:
      - database
      - valkey
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  valkey_data:
