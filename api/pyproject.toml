[project]
name = "api-pulso"
version = "0.1.0"
description = "Api para envio de comunicaciones masivas"
authors = [
    { name = "Luis Guzmán", email = "111367000+lyrionlannister@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=23.1.0",
    "fastapi[standard]>=0.162.0",
    "fastexcel>=0.21.0",
    "google-auth>=2.36.0",
    "httpx>=0.28.0",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.9.0",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "sqlalchemy[postgresql-asyncpg]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "import-linter>=2.16",
    "openpyxl>=3.1.5",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["alembic/versions"]
