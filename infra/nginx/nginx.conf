# TLS para dev local con mkcert (ver /CLAUDE.md, "infra/certs/"). El
# certificado se monta por volumen desde infra/certs/, nunca se hornea en
# la imagen -- es local y gitignored.

server {
    listen 80;
    server_name app.pulso.local api.pulso.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.pulso.local;

    ssl_certificate     /etc/nginx/certs/pulso.local+5.pem;
    ssl_certificate_key /etc/nginx/certs/pulso.local+5-key.pem;

    location / {
        proxy_pass http://client:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR de Vite necesita el upgrade de WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name api.pulso.local;

    ssl_certificate     /etc/nginx/certs/pulso.local+5.pem;
    ssl_certificate_key /etc/nginx/certs/pulso.local+5-key.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
